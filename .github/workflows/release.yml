name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate extension files
        run: |
          # Validate manifest.json is valid JSON
          python3 -c "import json; json.load(open('manifest.json'))" || exit 1
          echo "✓ manifest.json is valid JSON"

          # Check that all critical files exist
          for file in manifest.json cs.js popup.html popup.js popup.css options.html options.js options.css ico.svg; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done
          echo "✓ All required files present"

          # Check lib directory exists
          if [ ! -d "lib" ]; then
            echo "ERROR: lib directory missing"
            exit 1
          fi
          echo "✓ lib directory present"

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "
          import json, sys
          try:
              v = json.load(open('manifest.json')).get('version')
              if not v:
                  print('ERROR: version field missing from manifest.json', file=sys.stderr)
                  sys.exit(1)
              print(v)
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension as ZIP
        run: |
          mkdir -p dist
          zip -r dist/volume-control-${{ steps.version.outputs.version }}.zip . \
            -x "*.git*" ".github/*" "dist/*" "node_modules/*" ".vscode/*" "*.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Installation (Developer Mode)

            1. Download the `.zip` file from the Assets section below.
            2. Extract it to a folder on your computer.
            3. Open Chrome and navigate to `chrome://extensions/`.
            4. Enable **Developer mode** (toggle in the top-right corner).
            5. Click **Load unpacked** and select the extracted folder.

            For Firefox, load the extracted folder via `about:debugging` → *This Firefox* → *Load Temporary Add-on*.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
